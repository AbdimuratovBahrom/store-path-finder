<!DOCTYPE html>
<html lang="{{ get_locale() }}">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ _('Поиск магазина') }}</title>
  <link rel="shortcut icon" href="/static/images/Logo Abu saxiy.jpg" type="image/x-icon">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="header">
    <div class="language-selector">
      <select id="languageSelect">
        {% for code, name in LANGUAGES.items() %}
        <option value="{{ code }}" {% if get_locale_str==code %}selected{% endif %}>{{ name }}</option>


        {% endfor %}
      </select>
    </div>

    <div class="toggle-btn">
      <button id="toggle-btn" type="button" data-hide="{{ _('Скрыть блоки') }}" data-show="{{ _('Показать блоки') }}">
        {{ _('Скрыть блоки') }}
      </button>
    </div>
  </div>

  <div id="blocks-container" class="blocks-visible">
    <div class="container">
      <h1>{% trans %}Поиск линий электроснабжения магазинов{% endtrans %}</h1>

      <select id="block" onchange="loadRows()">
        <option value="">{{ _('Выберите блок') }}</option>
        {% for block in blocks %}
        <option value="{{ block }}">{{ block }}</option>
        {% endfor %}
      </select>

      <select id="row" onchange="loadStores()" disabled>
        <option value="">{{ _('Выберите ряд') }}</option>
      </select>

      <select id="store" onchange="getPath()" disabled>
        <option value="">{{ _('Выберите магазин') }}</option>
      </select>

      <div id="pathResult"></div>
    </div>
  </div>

  <div class="search-form">
    <form id="search-form" action="/search" method="get" onsubmit="return doSearch(event)">
      <input type="text" id="keyword" name="keyword"
        placeholder="{% trans %}Введите номер или название...{% endtrans %}">
      <button type="submit">🔍</button>
    </form>
  </div>

  <div id="search-results"></div>

  <div class="case">
    <a target="_blank" href="https://abdimuratovbahrom.github.io/tashkent-trade-center/">
      {% trans %}Блоки 1,2,3{% endtrans %}
    </a>
  </div>

  <script src="/static/script.js"></script>
</body>

</html>
